[providers]
php = "8.4"

[variables]
PHP_VERSION = "8.4"

[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nodejs_20"]

[phases.install]
cmds = [
  "composer install --optimize-autoloader --no-scripts --no-interaction",
  "NODE_OPTIONS='--max-old-space-size=1024' npm install --no-audit --no-fund"
]